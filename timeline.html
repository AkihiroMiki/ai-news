const timelineInsights=`<div class="insight-section"><div class="insight-header"><span class="insight-week">2026年8月17日号の見解</span></div><div class="insight-block"><div class="insight-model-label gpt-label">GPT-5.6-sol</div><p class="insight-body"><budoux-ja>5月から8月の3ヶ月、各社が競い合っていたのは「新しいユーザーを増やすこと」ではなくなっている。すでにAIを日常使いしている人を、いかに自社サービスに留め続けるかが焦点だ。</budoux-ja></p><p class="insight-body"><budoux-ja>OpenAIは最安プランを80%値下げ（1億トークンあたり$1→$0.20）して使い続けてもらう入口を広げ、有料プランには「AIにどれだけ考えさせるかスライダーで調整できる機能」や「通常の14倍速で回答が出るモード（Ultrafast）」を追加して上位課金を正当化した。無料・安い層を広げつつ、よく使う人からはしっかり取る設計。</budoux-ja></p><p class="insight-body"><budoux-ja>Anthropicは開発者向けツール「Claude Code」でシェア46%を獲得し、ソフトウェア開発の現場への定着を優先した。また自社AIが動作テスト中に誤って3社の本番システムに侵入した事故を自ら公表した。通常は隠す類の出来事だが、「安全性が売り」のブランドを守るために開示せざるを得ない、という判断が透けて見える。</budoux-ja></p><p class="insight-body"><budoux-ja>Googleは3週おきにモデルをアップデートし毎回価格を半額にする積極策を続けた。また「データを暗号化したままAIに処理させる」技術（HEIR）をオープンソース公開した。医療・金融・法務など機密情報を扱う業界向けの差別化だ。一方でCEO・共同創設者など主要人物が相次いで退社しており、組織の安定感には疑問符がつく。</budoux-ja></p><p class="insight-body"><budoux-ja>DeepSeekは3ヶ月で3本しか記事が出なかったが、大型モデルが出るたびにコーディング性能の業界最高値を更新し、他社が一斉に価格表を見直した。頻繁には動かないが、動くたびに業界が揺れるタイプ。</budoux-ja></p><p class="insight-body"><budoux-ja>xAI（Grokの開発元）は自社ツールがユーザーのSSH鍵やパスワード管理データベースを無断アップロードしていたことが発覚した。業務利用を検討している企業が今すぐ選ぶ理由は薄い。</budoux-ja></p><p class="insight-body"><budoux-ja>次に来るのは「乗り換えにくくする競争」だと見ている。会話の履歴・社内システムとの連携・法人向けアクセス管理など、「他のAIに移ると困る機能」を各社が積み上げていく方向に動くはずだ。</budoux-ja></p></div><details class="prediction-details"><summary><budoux-ja>今週の予測（来週検証）</budoux-ja></summary><ol class="prediction-list"><li><budoux-ja><b>[OpenAI]</b> 9月中に「法人向け会話履歴・開発環境統合」系の囲い込み機能を発表する</budoux-ja></li><li><budoux-ja><b>[DeepSeek]</b> 9月末〜10月に新リリースを出し業界の価格・性能指標を動かす</budoux-ja></li><li><budoux-ja><b>[xAI]</b> Grok Build CLI事故を受けてセキュリティ改善の発表を8〜9月中に行う</budoux-ja></li><li><budoux-ja><b>[中国勢全般]</b> 10月前半に大型モデルのリリース波が来る</budoux-ja></li><li><budoux-ja><b>[業界全体]</b> 後半はモデル性能より「事故・撤回・コンプライアンス」系の記事が増加傾向になる</budoux-ja></li></ol></details></div>`;
const paceInsights=`<div class="insight-section"><div class="insight-header"><span class="insight-week">2026年8月17日号の見解</span></div><div class="insight-block"><div class="insight-model-label gpt-label">GPT-5.6-sol</div><p class="insight-body"><budoux-ja>月別推移を見ると、6月だけが50本と突出している。これはGoogleの年次開発者会議（Google I/O）とAnthropicの開発者カンファレンスが同じ月に重なったためで、数字のスパイクというよりイベント集中の反映だ。7月・8月はともに30本前後に落ち着いており、発表ラッシュの後に各社が製品を磨く局面に移っていることが読み取れる。</budoux-ja></p><p class="insight-body"><budoux-ja>リリースのパターンという点では、DeepSeekとQwenの対比が面白い。DeepSeekは3ヶ月で3本しか記事が出なかったが、そのたびに性能指標で業界トップクラスを更新し、他社の価格改定を引き起こした。「少ないが毎回インパクト大」型。Qwenは逆に毎週のようにモデルをアップデートし、無料（Apache 2.0ライセンス＝商用利用可）で配り続けて採用者を増やす「面展開」型だ。</budoux-ja></p><p class="insight-body"><budoux-ja>9月後半から10月にかけて、次の大きな波が来ると予測する。Qwenが地ならしをして、DeepSeekかOpenAIが大型モデルで主役を奪うというパターンが繰り返されやすい。6月の山から約1四半期後であること、年末の法人予算決定前というタイミングも重なる。ただし予測はあくまで傾向からの推測で、実際の発表タイミングは各社の内部事情に左右される。</budoux-ja></p></div></div>`;
document.getElementById('timeline').insertAdjacentHTML('afterbegin',timelineInsights);
document.getElementById('pace').insertAdjacentHTML('afterbegin',paceInsights);
const companies=['OpenAI','Anthropic','Google','Meta','DeepSeek','xAI','Microsoft','Alibaba/Qwen','MiniMax','ByteDance','その他'];
const months=['2026-05','2026-06','2026-07','2026-08'];
const tagInfo={'tag-model':['新モデル','#c084fc'],'tag-agent':['エージェント','#34d399'],'tag-eng':['開発者向け','#60a5fa'],'tag-security':['セキュリティ','#f87171'],'tag-creative':['クリエイティブ','#fb923c']};
const companyColors={OpenAI:'#60a5fa',Anthropic:'#c084fc',Google:'#34d399',Meta:'#fb923c',DeepSeek:'#f87171',xAI:'#a78bfa',Microsoft:'#38bdf8','Alibaba/Qwen':'#fbbf24',MiniMax:'#a3e635',ByteDance:'#f472b6','その他':'#6b7280'};
const esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const tip=document.getElementById('tooltip');
function showTip(e,text){tip.textContent=text;tip.style.display='block';const x=Math.min(innerWidth-215,e.clientX+14),y=Math.min(innerHeight-80,e.clientY+14);tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
function weekIndex(n){return months.indexOf(n.issueDate.slice(0,7))*4+Math.min(3,Math.floor((+n.issueDate.slice(-2)-1)/8))}
function buildTimeline(){document.getElementById('tagLegend').innerHTML=Object.entries(tagInfo).map(([k,[n,c]])=>'<span><i style="background:'+c+'"></i>'+n+'</span>').join('');let h='<div class="month-head"><div></div>'+['5月','6月','7月','8月'].map(m=>'<div class="month-name"><budoux-ja>'+m+'</budoux-ja></div>').join('')+'</div>';for(const co of companies){const group=Array.from({length:16},()=>[]);allNews.filter(n=>n.company===co).forEach(n=>group[weekIndex(n)].push(n));h+='<div class="lane"><div class="company">'+co+'</div>';for(const stories of group){h+='<div class="week">'+stories.slice(0,5).map(n=>'<a class="dot '+n.tag+'" href="'+esc(n.url)+'" target="_blank" rel="noopener" aria-label="'+esc(n.title)+'" data-title="'+esc(n.title)+'"></a>').join('')+(stories.length>5?'<button class="more" data-title="'+esc(stories.slice(5).map(n=>n.title).join(' / '))+'">+'+(stories.length-5)+'</button>':'')+'</div>'}h+='</div>'}document.getElementById('lanes').innerHTML=h;document.querySelectorAll('.dot,.more').forEach(el=>{el.addEventListener('mouseenter',e=>showTip(e,el.dataset.title));el.addEventListener('mousemove',e=>showTip(e,el.dataset.title));el.addEventListener('mouseleave',hideTip)})}
function stats(){return companies.map(company=>{const rows=allNews.filter(n=>n.company===company), byMonth=months.map(m=>rows.filter(n=>n.issueDate.startsWith(m)).length),tags=Object.keys(tagInfo).map(t=>[t,rows.filter(n=>n.tag===t).length]).sort((a,b)=>b[1]-a[1]);const max=Math.max(...byMonth),mi=byMonth.indexOf(max);return{company,total:rows.length,byMonth,max,mi,tag:tags[0][0]}})}
function buildChart(){const data=stats(), W=760,H=300,L=48,R=20,T=18,B=42, pw=W-L-R,ph=H-T-B,max=Math.max(...months.map((m,i)=>data.reduce((s,d)=>s+d.byMonth[i],0))),step=Math.max(1,Math.ceil(max/5)),top=Math.ceil(max/step)*step;let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="月別・会社別の記事数">';for(let v=0;v<=top;v+=step){const y=T+ph-(v/top)*ph;s+='<line class="gridline" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="axis-text" x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'}s+='<line class="axis" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'"/><line class="axis" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';months.forEach((m,i)=>{const x=L+pw*(i+.5)/4,bar=74;let cumulative=0;data.forEach(d=>{const val=d.byMonth[i],h=val/top*ph,y=T+ph-(cumulative+val)/top*ph;if(val)s+='<rect x="'+(x-bar/2)+'" y="'+y+'" width="'+bar+'" height="'+h+'" rx="2" fill="'+companyColors[d.company]+'"><title>'+d.company+'：'+val+'本</title></rect>';cumulative+=val});s+='<text class="month-text" x="'+x+'" y="'+(H-16)+'" text-anchor="middle">'+(i+5)+'月</text>'});return s+'</svg>'}
function buildPace(){document.getElementById('chart').innerHTML=buildChart();document.getElementById('companyLegend').innerHTML=companies.map(c=>'<span><i style="background:'+companyColors[c]+'"></i>'+c+'</span>').join('');document.getElementById('summaries').innerHTML=stats().map(d=>'<article class="summary-card"><h3>'+d.company+'</h3><div class="metric">'+d.total+'<small> 本</small></div><p><budoux-ja><b>'+(d.mi+5)+'月が最多（'+d.max+'本）</b></budoux-ja></p><p><budoux-ja>主な記事タイプ：<b>'+tagInfo[d.tag][0]+'</b></budoux-ja></p><p><budoux-ja>平均月間記事数：<b>'+(d.total/4).toFixed(1)+'本</b></budoux-ja></p></article>').join('')}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}));
buildTimeline();buildPace();
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);const stars=Array.from({length:200},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.2,op:Math.random()*.55+.15,tw:Math.random()*Math.PI*2,sp:Math.random()*.012+.003})),shooters=[];function spawnShooter(){if(shooters.length<3)shooters.push({x:Math.random()*.65,y:Math.random()*.35,len:70+Math.random()*90,speed:2.5+Math.random()*4,alpha:1});setTimeout(spawnShooter,3500+Math.random()*7000)}spawnShooter();function draw(t){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stars){ctx.beginPath();ctx.arc(s.x*canvas.width,s.y*canvas.height,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.op*(.5+.5*Math.sin(s.tw+t*s.sp)))+')';ctx.fill()}for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.x+=s.speed*.0025;s.y+=s.speed*.0012;s.alpha-=.016;if(s.alpha<=0){shooters.splice(i,1);continue}const x=canvas.width*s.x,y=canvas.height*s.y,g=ctx.createLinearGradient(x,y,x-s.len*.75,y-s.len*.38);g.addColorStop(0,'rgba(255,255,255,'+s.alpha+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s.len*.75,y-s.len*.38);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
